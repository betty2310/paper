[workspace]
resolver = "3"
members = [
    "crates/paper-ids",
    "crates/paper-core",
    "crates/paper-fetch",
    "crates/paper-engine",
    "crates/paper-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/betty2310/paper"

[workspace.dependencies]
paper-ids = { path = "crates/paper-ids" }
paper-core = { path = "crates/paper-core" }
paper-fetch = { path = "crates/paper-fetch" }
paper-engine = { path = "crates/paper-engine" }
uniffi = "0.32"
thiserror = "2"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
jiff = "0.2"
uuid = { version = "1", features = ["v7"] }
directories = "6"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
tempfile = "3"
sha2 = "0.10"
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Proc macros are host dylibs that rustc loads at build time. With Xcode 27,
# stripping them leaves a misaligned LINKEDIT string pool and dlopen fails.
[profile.release.build-override]
strip = false
