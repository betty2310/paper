# Builds Paper.app on a version tag (v0.2.0) and publishes it as a GitHub
# release with the Sparkle appcast that installed copies check for updates.
#
# Repository settings:
#   variable SPARKLE_PUBLIC_KEY   EdDSA public key (`generate_keys -p`)
#   secret   SPARKLE_PRIVATE_KEY  EdDSA private key (`generate_keys -x <file>`)
#   secret   MACOS_CERT_P12       base64 of signing/paper-signing.p12 from
#                                 scripts/create-signing-cert.sh (optional;
#                                 without it the app is signed ad hoc)
#   secret   MACOS_CERT_PASSWORD  password of that .p12
#   secret   SENTRY_AUTH_TOKEN    Sentry organization token, to upload debug
#                                 symbols for crash reports (optional)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # A tag run can restore caches saved on main but not those saved on
      # other tags, so rust-cache.yml saves this cache on main and releases
      # only read it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: false

      - name: Check release settings
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_KEY" || -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::Set the SPARKLE_PUBLIC_KEY variable and the SPARKLE_PRIVATE_KEY secret; see README.md, Releases."
            exit 1
          fi

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::warning::MACOS_CERT_P12 is not set; signing ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate is self-signed, so it is not "valid" (-v) here;
          # codesign signs with it by its SHA-1 all the same.
          identity="$(security find-identity -p codesigning "$keychain" | awk '/\)/ { print $2; exit }')"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build Paper.app
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/package-macos-app.sh "${GITHUB_REF_NAME#v}"

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # The numbers in SentryDSN of apps/macos/Paper/Info.plist.
          SENTRY_ORG: "4512412237955072"
          SENTRY_PROJECT: "4512412246933504"
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set; crash reports from this release show Paper's frames as addresses."
            exit 0
          fi
          npx --yes @sentry/cli@2 debug-files upload --wait dist/*.dSYM

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Paper ${GITHUB_REF_NAME#v}" \
            dist/Paper-*.zip dist/appcast.xml
